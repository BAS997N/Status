<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f3e24" />
    <title>אין חיבור לאינטרנט</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #1e293b; font-family: Arial, sans-serif; }
      main { width: min(100%, 430px); text-align: center; background: white; border: 1px solid #e2e8f0; border-radius: 20px; padding: 32px 24px; box-shadow: 0 12px 35px rgba(15, 23, 42, .08); }
      img { width: 112px; height: 112px; border-radius: 24px; }
      h1 { margin: 20px 0 8px; font-size: 24px; }
      p { margin: 0 0 22px; color: #64748b; line-height: 1.7; }
      button { border: 0; border-radius: 12px; padding: 12px 22px; background: #2f3e24; color: white; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/Status/icon-192.png" alt="סמל תאג״ד 997" />
      <h1>אין כרגע חיבור לאינטרנט</h1>
      <p>לא ניתן לשלוח דיווחים ללא חיבור. התחבר לרשת ולחץ על ניסיון חוזר.</p>
      <button type="button" onclick="location.reload()">נסה שוב</button>
    </main>
  </body>
</html>
